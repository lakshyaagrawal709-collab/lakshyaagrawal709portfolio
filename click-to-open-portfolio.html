<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opening Lakshay Agrawal Portfolio...</title>
  <style>
    body {
      background-color: #090D16;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(13, 19, 34, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.4);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-width: 500px;
    }
    h1 { color: #60A5FA; margin-bottom: 10px; }
    p { color: #94A3B8; font-size: 14px; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Lakshay Agrawal Portfolio</h1>
    <p>To view the portfolio, click the button below to launch the local server link or double-click <strong>run-portfolio.bat</strong> in your project folder!</p>
    <a href="http://localhost:3030" class="btn" target="_blank">Open Portfolio (http://localhost:3030)</a>
  </div>
</body>
</html>
